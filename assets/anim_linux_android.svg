<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <text x="450" y="30" font-family="monospace" font-size="20" font-weight="700" fill="#2D3436" text-anchor="middle">Linux to Android</text>
  <g transform="translate(450,70)">
    <circle r="8" fill="none" stroke="#0984E3" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="8;40;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#0984E3"/>
    <text y="55" font-size="12" fill="#636E72" text-anchor="middle" font-family="monospace">NFC Tap</text>
  </g>
  <g transform="translate(150,150)">
    <rect x="-45" y="-40" width="90" height="60" rx="4" fill="none" stroke="#0984E3" stroke-width="3"/>
    <rect x="-15" y="20" width="30" height="6" fill="#0984E3"/>
    <rect x="-25" y="26" width="50" height="6" rx="2" fill="#0984E3"/>
    <text y="70" font-size="14" fill="#2D3436" text-anchor="middle" font-family="monospace">Linux</text>
  </g>
  <g transform="translate(750,150)">
    <rect x="-25" y="-50" width="50" height="90" rx="10" fill="none" stroke="#3DDC84" stroke-width="3"/>
    <line x1="-15" y1="-42" x2="15" y2="-42" stroke="#3DDC84" stroke-width="2"/>
    <circle cx="0" cy="32" r="4" fill="#3DDC84"/>
    <text y="70" font-size="14" fill="#2D3436" text-anchor="middle" font-family="monospace">Android</text>
  </g>
  <line x1="205" y1="150" x2="695" y2="150" stroke="#B2BEC3" stroke-width="2" stroke-dasharray="6,6"/>
  <g>
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#00B894"/>
    <path d="M -14 -3 L 0 5 L 14 -3" fill="none" stroke="white" stroke-width="1.5"/>
    <animateMotion path="M 205 150 L 695 150" dur="3s" repeatCount="indefinite"/>
  </g>
  <text x="450" y="220" font-size="13" fill="#00B894" text-anchor="middle" font-family="monospace">Streaming 64KB chunks over Wi-Fi Direct</text>
